<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | WasteTech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1>Create Account</h1>
        {% if message %}
        <p class="auth-error">{{ message }}</p>
        {% endif %}
        <form method="post" action="/register">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose username" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create password" minlength="6" required>
            <p class="password-hint">Must be at least 6 characters with letters, numbers & special characters (e.g. !@#$%)</p>

            <button type="submit">Register</button>
        </form>
        <p class="auth-link">Already have an account? <a href="/login">Login</a></p>
    </div>
</body>
</html>

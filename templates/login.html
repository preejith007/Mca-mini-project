<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | WasteTech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1>Login</h1>

        {% if success_message %}
        <p class="auth-success">✓ {{ success_message }}</p>
        {% endif %}

        {% if message %}
        <p class="auth-error">{{ message }}</p>
        {% endif %}

        {% if show_verify_link %}
        <p class="auth-link" style="margin-bottom: 12px;"><a href="/verify-otp">Click here to enter your OTP code</a></p>
        {% endif %}

        <form method="post" action="/login">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username" placeholder="Enter username or email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>
        <p class="auth-link">New here? <a href="/register">Create an account</a></p>
    </div>
</body>
</html>

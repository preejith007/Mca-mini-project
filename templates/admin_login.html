<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | WasteTech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .admin-auth-body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: 'Segoe UI', system-ui, sans-serif; }
        .admin-login-card { background: #1e293b; color: #f8fafc; width: 100%; max-width: 420px; border-radius: 20px; padding: 36px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid #334155; }
        .admin-badge { background: #3b82f6; color: #ffffff; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 12px; }
        .admin-login-card h1 { font-size: 24px; margin: 0 0 8px; font-weight: 800; color: #ffffff; }
        .admin-login-card p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .admin-login-card label { color: #cbd5e1; font-weight: 600; font-size: 13px; margin-bottom: 6px; display: block; }
        .admin-login-card input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #ffffff; margin-bottom: 18px; font-size: 14px; box-sizing: border-box; }
        .admin-login-card input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59,130,246,0.25); }
        .admin-btn { background: #3b82f6; color: #ffffff; width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .admin-btn:hover { background: #2563eb; }
        .demo-cred-box { background: #0f172a; border: 1px dashed #475569; padding: 12px 14px; border-radius: 10px; margin-top: 20px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body class="admin-auth-body">
    <div class="admin-login-card">
        <a href="/" class="back-home-link" style="color: #94a3b8; text-decoration: none; font-size: 13px; display: block; margin-bottom: 16px;"><i class="fa-solid fa-arrow-left"></i> Back to WasteTech Home</a>
        
        <span class="admin-badge"><i class="fa-solid fa-user-shield"></i> Master Control</span>
        <h1>Admin Portal Access</h1>
        <p>Log in with system administrator credentials to access main system controls & analytics.</p>

        {% if message %}
        <div class="auth-error" style="margin-bottom: 20px;">{{ message }}</div>
        {% endif %}

        <form method="post" action="/admin/login">
            <label for="username"><i class="fa-solid fa-user"></i> Admin Username or Email</label>
            <input type="text" id="username" name="username" placeholder="admin@wastetech.com" required>

            <label for="password"><i class="fa-solid fa-key"></i> Security Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••••••" required>

            <button type="submit" class="admin-btn"><i class="fa-solid fa-right-to-bracket"></i> Authenticate & Enter Admin Dashboard</button>
        </form>

        <div class="demo-cred-box">
            <strong style="color: #38bdf8;"><i class="fa-solid fa-circle-info"></i> Default Admin Credentials:</strong><br>
            Email: <code style="color: #f1f5f9;">admin@wastetech.com</code><br>
            Password: <code style="color: #f1f5f9;">Admin@123</code>
        </div>
    </div>
</body>
</html>
